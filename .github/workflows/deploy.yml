name: Deploy Application
on:
  push:
    branches: ["main", "master"]
  pull_request:
    types: ["opened", "reopened", "synchronize", "closed"]

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: false

env:
  STAGE: "${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref == 'refs/heads/master' && 'prod' || (github.ref == 'refs/heads/main' && 'prod' || github.ref_name)) }}"
  ALCHEMY_CI_STATE_STORE_CHECK: "false"

jobs:
  deploy:
    if: "${{ github.event.action != 'closed' }}"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      pull-requests: "write"
    steps:
      - uses: "actions/checkout@v4"

      - name: "Setup Bun"
        uses: "oven-sh/setup-bun@v2"

      - name: "Install dependencies"
        run: "bun install"

      - name: "Write deploy env files"
        run: |
          cat > packages/infra/.env <<EOF
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          EOF

      - name: "Deploy"
        run: "bun run deploy -- --stage ${{ env.STAGE }} --yes"
        env:
          ALCHEMY_PASSWORD: "${{ secrets.ALCHEMY_PASSWORD }}"
          ALCHEMY_STATE_TOKEN: "${{ secrets.ALCHEMY_STATE_TOKEN }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CLOUDFLARE_EMAIL: "${{ secrets.CLOUDFLARE_EMAIL }}"
          ALCHEMY_CI_STATE_STORE_CHECK: "false"
          BETTER_AUTH_SECRET: "${{ secrets.BETTER_AUTH_SECRET }}"
          ADMIN_EMAILS: "${{ secrets.ADMIN_EMAILS }}"
          RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}"
          RESEND_WEBHOOK_SECRET: "${{ secrets.RESEND_WEBHOOK_SECRET }}"
          GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          PULL_REQUEST: "${{ github.event.number }}"
          GITHUB_SHA: "${{ github.sha }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  cleanup:
    runs-on: "ubuntu-latest"
    if: "${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}"
    permissions:
      id-token: "write"
      contents: "read"
      pull-requests: "write"
    steps:
      - uses: "actions/checkout@v4"

      - name: "Setup Bun"
        uses: "oven-sh/setup-bun@v2"

      - name: "Install dependencies"
        run: "bun install"

      - name: "Safety Check"
        run: |
          if [ "${{ env.STAGE }}" = "prod" ]; then
            echo "ERROR: Cannot destroy prod environment in cleanup job"
            exit 1
          fi

      - name: "Destroy Preview Environment"
        run: "bun run destroy -- --stage ${{ env.STAGE }}"
        env:
          ALCHEMY_PASSWORD: "${{ secrets.ALCHEMY_PASSWORD }}"
          ALCHEMY_STATE_TOKEN: "${{ secrets.ALCHEMY_STATE_TOKEN }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CLOUDFLARE_EMAIL: "${{ secrets.CLOUDFLARE_EMAIL }}"
          ALCHEMY_CI_STATE_STORE_CHECK: "false"
          BETTER_AUTH_SECRET: "${{ secrets.BETTER_AUTH_SECRET }}"
          ADMIN_EMAILS: "${{ secrets.ADMIN_EMAILS }}"
          RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}"
          RESEND_WEBHOOK_SECRET: "${{ secrets.RESEND_WEBHOOK_SECRET }}"
          GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          PULL_REQUEST: "${{ github.event.number }}"
